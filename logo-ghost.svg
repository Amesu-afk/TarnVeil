    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 .18  0 .25 0 0 .02  0 0 1 0 .35  0 0 0 .82 0"/>
    </filter>

    <filter id="tightGlow" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB">
