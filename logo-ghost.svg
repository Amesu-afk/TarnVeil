    <radialGradient id="bodyLight" cx="0" cy="0" r="1" gradientTransform="translate(512 421) rotate(43) scale(445 470)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d783fa" stop-opacity=".52"/>
      <stop offset=".42" stop-color="#9c51e2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6435bf" stop-opacity="0"/>
