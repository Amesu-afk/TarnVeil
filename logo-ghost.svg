    <linearGradient id="bottomGlowColor" x1="392" y1="824" x2="835" y2="874" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9554ff" stop-opacity=".78"/>
      <stop offset=".22" stop-color="#7548f4" stop-opacity=".56"/>
      <stop offset=".48" stop-color="#6544e8" stop-opacity=".44"/>
