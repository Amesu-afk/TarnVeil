    <rect x="676" y="518" width="50" height="87" rx="25" fill="url(#face)" stroke="#6b42c9" stroke-width="2"/>
    <path d="M590 626C609 635 634 636 653 626C661 622 666 628 663 637C656 656 639 666 621 666C602 666 586 655 580 638C576 627 582 622 590 626Z" fill="url(#face)" stroke="#6540bf" stroke-width="2"/>
