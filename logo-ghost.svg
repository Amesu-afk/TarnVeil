    <path d="M886 604V754C886 829 864 876 834 893" fill="none" stroke="url(#rightRim)" stroke-width="24" stroke-linecap="round" opacity=".74"/>

    <path d="M388 788V853C388 893 408 908 429 901C455 893 472 865 493 850C507 839 525 844 534 855C550 875 551 905 558 924C566 946 590 949 611 943C650 932 673 899 697 866C710 848 724 841 742 843C768 845 781 860 789 879C799 902 819 902 834 893" fill="none" stroke="url(#bottomGlowColor)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" opacity=".78" filter="url(#edgeBlur)"/>
    <path d="M388 823V853C388 893 408 908 429 901C455 893 472 865 493 850C507 839 525 844 534 855C550 875 551 905 558 924C566 946 590 949 611 943C650 932 673 899 697 866C710 848 724 841 742 843C768 845 781 860 789 879C799 902 819 902 834 893" fill="none" stroke="url(#bottomGlowColor)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity=".58"/>
  </g>

  <g filter="url(#tightGlow)" opacity=".58">
    <circle cx="790" cy="550" r="13" fill="#9851ff"/>
