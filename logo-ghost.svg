      <path d="M884 550C884 415 776 306 642 306C500 306 387 414 387 550C387 632 352 683 294 709C287 712 287 719 294 723C322 735 351 737 388 737V853C388 893 408 908 429 901C455 893 472 865 493 850C507 839 525 844 534 855C550 875 551 905 558 924C566 946 590 949 611 943C650 932 673 899 697 866C710 848 724 841 742 843C768 845 781 860 789 879C799 902 819 902 834 893C864 876 886 829 886 754V604L884 550Z"/>
